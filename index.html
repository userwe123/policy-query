<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>保单查询 - 首页</title>
<link rel="stylesheet" href="styles.css">
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<script>
// 登录检查
if (!sessionStorage.getItem('loggedIn')) {
  window.location.href = 'login.html';
}

<style>
/* 页面特定样式 */
.search-card {
  background: var(--bg-secondary);
  border-radius: var(--radius-lg);
  padding: var(--spacing-lg);
  box-shadow: var(--shadow-md);
  margin-bottom: var(--spacing-lg);
}

.search-row {
  display: flex;
  gap: var(--spacing-md);
  align-items: center;
  flex-wrap: wrap;
}

.search-input {
  flex: 1;
  min-width: 240px;
}

.search-actions {
  display: flex;
  gap: var(--spacing-sm);
}

.search-hint {
  font-size: var(--font-size-sm);
  color: var(--text-muted);
  margin-top: var(--spacing-sm);
  display: flex;
  align-items: center;
  gap: var(--spacing-xs);
}

.export-bar {
  display: flex;
  gap: var(--spacing-sm);
  margin-bottom: var(--spacing-lg);
  flex-wrap: wrap;
  animation: fadeIn 0.3s ease;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(-10px); }
  to { opacity: 1; transform: translateY(0); }
}

.progress-container {
  background: var(--bg-secondary);
  border-radius: var(--radius-md);
  padding: var(--spacing-md);
  margin-bottom: var(--spacing-lg);
  box-shadow: var(--shadow-sm);
}

.progress-info {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-top: var(--spacing-sm);
  font-size: var(--font-size-sm);
  color: var(--text-secondary);
}

.stats-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
  gap: var(--spacing-md);
  margin-bottom: var(--spacing-lg);
}

.results-container {
  background: var(--bg-secondary);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-md);
  overflow: hidden;
}

.results-header {
  padding: var(--spacing-md) var(--spacing-lg);
  border-bottom: 1px solid var(--border-light);
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: var(--spacing-md);
}

.results-header .info {
  font-size: var(--font-size-base);
  color: var(--text-secondary);
}

.result-item {
  padding: var(--spacing-lg);
  border-bottom: 1px solid var(--border-light);
  transition: background var(--transition-fast);
}

.result-item:hover {
  background: var(--bg-tertiary);
}

.result-item:last-child {
  border-bottom: none;
}

.vehicle-info {
  display: flex;
  align-items: center;
  gap: var(--spacing-md);
  margin-bottom: var(--spacing-md);
  flex-wrap: wrap;
}

.plate-badge {
  background: var(--primary-color);
  color: white;
  padding: 6px 16px;
  border-radius: var(--radius-md);
  font-size: var(--font-size-lg);
  font-weight: 600;
  box-shadow: var(--shadow-sm);
}

.vin-text {
  font-size: var(--font-size-sm);
  color: var(--text-muted);
  font-family: 'Courier New', monospace;
}

.policy-cards {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
  gap: var(--spacing-md);
}

.policy-card {
  border: 1px solid var(--border-color);
  border-radius: var(--radius-md);
  padding: var(--spacing-md);
  position: relative;
  transition: all var(--transition-fast);
}

.policy-card:hover {
  transform: translateY(-2px);
  box-shadow: var(--shadow-md);
}

.policy-card.jqx {
  border-left: 4px solid var(--success-color);
}

.policy-card.syx {
  border-left: 4px solid var(--info-color);
}

.policy-type {
  font-size: var(--font-size-base);
  font-weight: 600;
  margin-bottom: var(--spacing-sm);
  display: flex;
  align-items: center;
  gap: var(--spacing-sm);
}

.policy-type .dot {
  width: 10px;
  height: 10px;
  border-radius: 50%;
}

.policy-type .dot.green { background: var(--success-color); }
.policy-type .dot.blue { background: var(--info-color); }

.policy-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 6px 0;
  font-size: var(--font-size-sm);
}

.policy-row .label {
  color: var(--text-muted);
}

.policy-row .value {
  font-weight: 500;
  color: var(--text-primary);
}

.policy-row .value.expiring {
  color: var(--warning-color);
  font-weight: 600;
}

.policy-row .value.expired {
  color: var(--danger-color);
  font-weight: 600;
}

.policy-actions {
  display: flex;
  gap: var(--spacing-sm);
  margin-top: var(--spacing-md);
  flex-wrap: wrap;
}

.download-btn {
  flex: 1;
  min-width: 120px;
  justify-content: center;
}

.download-hint {
  font-size: var(--font-size-xs);
  color: var(--text-muted);
  text-align: center;
  margin-top: var(--spacing-sm);
}

.not-found-item {
  background: rgba(250, 173, 20, 0.05);
  padding: var(--spacing-md) var(--spacing-lg);
  border-left: 4px solid var(--warning-color);
}

.not-found-title {
  color: var(--warning-color);
  font-weight: 600;
  margin-bottom: var(--spacing-sm);
}

.not-found-list {
  color: var(--text-secondary);
  font-size: var(--font-size-sm);
}

@media (max-width: 768px) {
  .search-row {
    flex-direction: column;
  }
  
  .search-input {
    width: 100%;
  }
  
  .search-actions {
    width: 100%;
  }
  
  .search-actions .btn {
    flex: 1;
  }
  
  .export-bar {
    flex-direction: column;
  }
  
  .export-bar .btn {
    width: 100%;
  }
  
  .stats-grid {
    grid-template-columns: repeat(2, 1fr);
  }
  
  .policy-cards {
    grid-template-columns: 1fr;
  }
  
  .policy-actions {
    flex-direction: column;
  }
  
  .download-btn {
    width: 100%;
  }
}
</style>
</head>
<body>

<div class="container">
  <div class="header">
    <h1>🔍 保单查询</h1>
    <p>输入车牌号或车架号，快速查询交强险与商业险信息</p>
    <div class="user-badge" id="userBadge" style="position:absolute;top:24px;left:24px;background:rgba(255,255,255,0.2);padding:6px 16px;border-radius:20px;font-size:var(--font-size-sm);border:1px solid rgba(255,255,255,0.4);"></div>
    <div style="position:absolute;top:24px;right:24px;display:flex;gap:var(--spacing-sm);">
      <button onclick="goToDashboard()" class="btn btn-ghost">📊 数据看板</button>
      <button onclick="goToAdmin()" id="adminBtn" class="btn btn-ghost" style="display:none;">访问管理</button>
      <button onclick="goToDataManagement()" id="dataMgmtBtn" class="btn btn-ghost" style="display:none;">数据管理</button>
      <button onclick="logout()" class="btn btn-ghost">退出登录</button>
    </div>
  </div>

  <div class="search-card">
    <div class="search-row">
      <input type="text" class="input search-input" id="searchInput" placeholder="支持多车查询，用逗号、空格或换行分隔" autofocus>
      <div class="search-actions">
        <button class="btn btn-primary" onclick="doSearch()">🔍 查询</button>
        <button class="btn btn-secondary" onclick="clearSearch()">清空</button>
      </div>
    </div>
    <div class="search-hint" id="searchHint">
      💡 支持多车查询：用逗号、空格或换行分隔多个车牌号/车架号
    </div>
  </div>

  <div class="export-bar" id="exportBar" style="display:none;">
    <button class="btn btn-success" onclick="exportQueryResults()">📊 导出查询结果</button>
    <button class="btn btn-warning" onclick="exportQueryPDFs()">📄 导出保单PDF</button>
    <button class="btn btn-primary" id="exportAllBtn" onclick="exportAllData()" style="display:none;">📦 导出所有数据</button>
    <button class="btn btn-primary" id="exportAllPDFBtn" onclick="exportAllPDFs()" style="display:none;">📄 导出所有保单</button>
  </div>

  <div id="progressContainer" class="progress-container" style="display:none;">
    <div class="progress">
      <div class="progress-bar" id="progressFill" style="width: 0%"></div>
    </div>
    <div class="progress-info">
      <span id="progressText">0%</span>
      <span id="progressInfo">准备下载...</span>
    </div>
  </div>

  <div class="stats-grid" id="statsBar" style="display:none">
    <div class="stat-card">
      <div class="icon">🚗</div>
      <div class="label">车辆总数</div>
      <div class="value" id="statVehicles">0</div>
    </div>
    <div class="stat-card">
      <div class="icon">📄</div>
      <div class="label">保单总数</div>
      <div class="value" id="statPolicies">0</div>
    </div>
    <div class="stat-card warning">
      <div class="icon">⚠️</div>
      <div class="label">即将到期</div>
      <div class="value" id="statExpiring">0</div>
    </div>
  </div>

  <div class="results-container" id="resultsArea">
    <div class="empty-state">
      <div class="icon">🔍</div>
      <div class="title">开始查询</div>
      <div class="description">请输入车牌号或车架号查询保单信息</div>
    </div>
  </div>

  <div class="footer" style="text-align:center;padding:var(--spacing-lg);color:var(--text-muted);font-size:var(--font-size-sm);">
    保单查询系统 · 数据来源于保单导出文件
  </div>
</div>

<script src="theme.js"></script>
<script>
// 当前用户信息
const currentUser = sessionStorage.getItem('username');
const isAdmin = currentUser === 'zhangdp';
const MAX_QUERY_COUNT = isAdmin ? Infinity : 3;

// 显示用户信息
document.getElementById('userBadge').textContent = `👤 ${currentUser}${isAdmin ? ' (管理员)' : ''}`;

// 显示管理员按钮
if (isAdmin) {
  document.getElementById('adminBtn').style.display = 'block';
  document.getElementById('dataMgmtBtn').style.display = 'block';
  document.getElementById('exportAllBtn').style.display = 'flex';
  document.getElementById('exportAllPDFBtn').style.display = 'flex';
}

// 更新搜索提示
if (!isAdmin) {
  document.getElementById('searchHint').textContent = `💡 支持多车查询（最多3台），用逗号、空格或换行分隔`;
}

// 退出登录
function logout() {
  sessionStorage.clear();
  window.location.href = 'login.html';
}

// 跳转到数据看板
function goToDashboard() {
  window.location.href = 'dashboard.html';
}

// 跳转到访问管理页面
function goToAdmin() {
  if (isAdmin) {
    window.location.href = 'admin.html';
  } else {
    alert('您没有权限访问此页面');
  }
}

// 跳转到数据管理页面
function goToDataManagement() {
  if (isAdmin) {
    window.location.href = 'data-management.html';
  } else {
    alert('您没有权限访问此页面');
  }
}

let POLICY_DATA = [];
let allVehicles = [];
let dataLoaded = false;
let lastQueryResults = [];

// 搜索频率限制
const SEARCH_LIMIT = {
  maxSearches: 20,
  windowMs: 60 * 1000,
  cooldownMs: 30 * 1000
};
let searchTimestamps = [];
let searchCooldownUntil = 0;

function checkSearchLimit() {
  const now = Date.now();
  
  if (now < searchCooldownUntil) {
    const remaining = Math.ceil((searchCooldownUntil - now) / 1000);
    return { allowed: false, message: `搜索过于频繁，请 ${remaining} 秒后重试` };
  }
  
  searchTimestamps = searchTimestamps.filter(t => now - t < SEARCH_LIMIT.windowMs);
  
  if (searchTimestamps.length >= SEARCH_LIMIT.maxSearches) {
    searchCooldownUntil = now + SEARCH_LIMIT.cooldownMs;
    return { allowed: false, message: `搜索过于频繁，请 ${SEARCH_LIMIT.cooldownMs / 1000} 秒后重试` };
  }
  
  searchTimestamps.push(now);
  return { allowed: true };
}

// 加载数据（优先使用预加载的数据）
async function loadData() {
  try {
    // 检查是否有预加载的数据
    const preloadedData = sessionStorage.getItem('preloadedData');
    const preloadedTime = sessionStorage.getItem('preloadedTime');
    
    if (preloadedData && preloadedTime) {
      const age = Date.now() - parseInt(preloadedTime);
      // 如果预加载数据在5分钟内，直接使用
      if (age < 5 * 60 * 1000) {
        POLICY_DATA = JSON.parse(preloadedData);
        console.log('✓ 使用预加载数据');
      } else {
        // 否则重新加载
        const resp = await fetch('data.json?t=' + Date.now());
        if (!resp.ok) throw new Error('HTTP ' + resp.status);
        POLICY_DATA = await resp.json();
        console.log('✓ 重新加载数据');
      }
    } else {
      // 没有预加载数据，正常加载
      const resp = await fetch('data.json?t=' + Date.now());
      if (!resp.ok) throw new Error('HTTP ' + resp.status);
      POLICY_DATA = await resp.json();
      console.log('✓ 首次加载数据');
    }
    
    const groups = {};
    POLICY_DATA.forEach(p => {
      if (!groups[p.vin]) {
        groups[p.vin] = { vin: p.vin, plate: p.plate, policies: [] };
      }
      groups[p.vin].policies.push(p);
    });
    allVehicles = Object.values(groups);
    
    document.getElementById('statVehicles').textContent = allVehicles.length;
    document.getElementById('statPolicies').textContent = POLICY_DATA.length;
    
    const today = new Date();
    const thirtyDaysLater = new Date(today.getTime() + 30 * 24 * 60 * 60 * 1000);
    let expiringCount = 0;
    POLICY_DATA.forEach(p => {
      if (p.end) {
        const endDate = new Date(p.end);
        if (endDate >= today && endDate <= thirtyDaysLater) expiringCount++;
      }
    });
    document.getElementById('statExpiring').textContent = expiringCount;
    
    dataLoaded = true;
  } catch (e) {
    console.error('加载数据失败:', e);
    document.getElementById('resultsArea').innerHTML = 
      '<div class="empty-state"><div class="icon">⚠️</div><div class="title">数据加载失败</div><div class="description">请刷新页面重试</div></div>';
  }
}

function getStatusClass(endDateStr) {
  if (!endDateStr) return '';
  const end = new Date(endDateStr);
  const today = new Date();
  const thirtyDaysLater = new Date(today.getTime() + 30 * 24 * 60 * 60 * 1000);
  if (end < today) return 'expired';
  if (end <= thirtyDaysLater) return 'expiring';
  return '';
}

function parseQueryInput(input) {
  return input
    .split(/[,，\s\n\r\t]+/)
    .map(s => s.trim().toUpperCase())
    .filter(s => s.length > 0);
}

function doSearch() {
  if (!dataLoaded) {
    alert('数据正在加载，请稍后再试');
    return;
  }
  
  const limitCheck = checkSearchLimit();
  if (!limitCheck.allowed) {
    alert(limitCheck.message);
    return;
  }
  
  const rawInput = document.getElementById('searchInput').value.trim();
  if (!rawInput) {
    showEmpty();
    return;
  }

  const queries = parseQueryInput(rawInput);
  
  if (queries.length === 0) {
    showEmpty();
    return;
  }
  
  if (queries.length > MAX_QUERY_COUNT) {
    alert(`查询数量超限\n\n当前输入：${queries.length} 台车\n允许上限：${MAX_QUERY_COUNT} 台车\n\n请减少查询数量后重试`);
    return;
  }

  const results = [];
  const notFound = [];
  
  queries.forEach(query => {
    const matched = allVehicles.filter(v =>
      v.plate.toUpperCase() === query || v.vin.toUpperCase() === query
    );
    
    if (matched.length > 0) {
      results.push(...matched);
    } else {
      notFound.push(query);
    }
  });

  if (results.length === 0) {
    let msg = '未找到匹配的保单信息';
    if (notFound.length > 0) {
      msg += `\n\n未找到的车牌/车架号：\n${notFound.join('\n')}`;
    }
    document.getElementById('resultsArea').innerHTML = 
      `<div class="empty-state"><div class="icon">😕</div><div class="title">未找到结果</div><div class="description">${msg.replace(/\n/g, '<br>')}</div></div>`;
    document.getElementById('exportBar').style.display = 'none';
    return;
  }

  lastQueryResults = results;
  renderResults(results, notFound);
  document.getElementById('exportBar').style.display = 'flex';
}

function clearSearch() {
  document.getElementById('searchInput').value = '';
  showEmpty();
  document.getElementById('exportBar').style.display = 'none';
  lastQueryResults = [];
}

function showEmpty() {
  document.getElementById('resultsArea').innerHTML = 
    '<div class="empty-state"><div class="icon">🔍</div><div class="title">开始查询</div><div class="description">请输入车牌号或车架号查询保单信息</div></div>';
  document.getElementById('exportBar').style.display = 'none';
  lastQueryResults = [];
}

function renderResults(results, notFound = []) {
  const area = document.getElementById('resultsArea');
  const today = new Date();
  const thirtyDaysLater = new Date(today.getTime() + 30 * 24 * 60 * 60 * 1000);

  let headerHtml = `<div class="results-header">`;
  headerHtml += `<span class="info">找到 ${results.length} 辆车，共 ${results.reduce((s, v) => s + v.policies.length, 0)} 份保单</span>`;
  headerHtml += `<span class="badge badge-primary">${isAdmin ? '管理员模式' : `普通模式（最多${MAX_QUERY_COUNT}台）`}</span>`;
  headerHtml += `</div>`;

  let html = headerHtml;

  results.forEach(v => {
    html += `<div class="result-item">`;
    html += `<div class="vehicle-info">`;
    html += `<span class="plate-badge">${v.plate}</span>`;
    html += `<span class="vin-text">车架号：${v.vin}</span>`;
    html += `</div>`;
    html += `<div class="policy-cards">`;

    v.policies.forEach(p => {
      const typeClass = p.type === '交强险' ? 'jqx' : 'syx';
      const dotClass = p.type === '交强险' ? 'green' : 'blue';
      const endStatus = getStatusClass(p.end);
      const endLabel = endStatus === 'expired' ? '已到期' : endStatus === 'expiring' ? '即将到期' : '';
      const company = p.company || '合众财产保险股份有限公司广东分公司';
      const phone = '400-609-5555';
      
      const rawPath = p.file.replace('https://cdn.jsdelivr.net/gh/userwe123/policy-query@main/', '');
      const mirrorUrl = `https://ghfast.top/https://raw.githubusercontent.com/userwe123/policy-query/main/${rawPath}`;

      html += `<div class="policy-card ${typeClass}">`;
      html += `<div class="policy-type"><span class="dot ${dotClass}"></span>${p.type}</div>`;
      html += `<div class="policy-row"><span class="label">保单号</span><span class="value">${p.policy_no}</span></div>`;
      html += `<div class="policy-row"><span class="label">起保日期</span><span class="value">${p.start}</span></div>`;
      html += `<div class="policy-row"><span class="label">到期日期</span><span class="value ${endStatus}">${p.end}${endLabel ? ' ⚠️' + endLabel : ''}</span></div>`;
      html += `<div class="policy-row"><span class="label">保险公司</span><span class="value">${company}</span></div>`;
      html += `<div class="policy-row"><span class="label">客服电话</span><span class="value"><a href="tel:${phone}" style="color:var(--primary-color);text-decoration:none;">${phone}</a></span></div>`;
      html += `<div class="policy-actions">`;
      html += `<a class="btn btn-primary download-btn" href="${p.file}" download>📥 下载保单</a>`;
      html += `<a class="btn btn-outline download-btn" href="${mirrorUrl}" download>⚡ 备用下载</a>`;
      html += `</div>`;
      html += `<div class="download-hint">如下载慢，请尝试备用下载</div>`;
      html += `</div>`;
    });

    html += `</div></div>`;
  });

  if (notFound.length > 0) {
    html += `<div class="not-found-item">`;
    html += `<div class="not-found-title">⚠️ 以下车牌/车架号未找到：</div>`;
    html += `<div class="not-found-list">${notFound.join('、')}</div>`;
    html += `</div>`;
  }

  area.innerHTML = html;
}

// 导出功能保持不变
function exportQueryResults() {
  if (lastQueryResults.length === 0) {
    alert('没有可导出的查询结果');
    return;
  }
  exportToCSV(lastQueryResults, `查询结果_${new Date().toISOString().split('T')[0]}`);
}

async function exportQueryPDFs() {
  if (lastQueryResults.length === 0) {
    alert('没有可导出的查询结果');
    return;
  }
  await exportPDFs(lastQueryResults, `查询保单_${new Date().toISOString().split('T')[0]}`);
}

async function exportAllPDFs() {
  if (!isAdmin) {
    alert('您没有权限执行此操作');
    return;
  }
  if (!confirm(`确定要导出系统中所有车辆保单PDF吗？\n\n共 ${allVehicles.length} 辆车，${POLICY_DATA.length} 份保单\n\n文件较大，请耐心等待`)) {
    return;
  }
  await exportPDFs(allVehicles, `所有保单_${new Date().toISOString().split('T')[0]}`);
}

async function exportPDFs(vehicles, zipName) {
  const progressContainer = document.getElementById('progressContainer');
  const progressFill = document.getElementById('progressFill');
  const progressText = document.getElementById('progressText');
  const progressInfo = document.getElementById('progressInfo');
  
  const pdfFiles = [];
  vehicles.forEach(v => {
    v.policies.forEach(p => {
      pdfFiles.push({
        url: p.file,
        filename: `${v.plate}_${p.type}_${p.policy_no}.pdf`,
        folder: v.plate
      });
    });
  });
  
  if (pdfFiles.length === 0) {
    alert('没有找到可导出的保单文件');
    return;
  }
  
  progressContainer.style.display = 'block';
  progressFill.style.width = '0%';
  progressText.textContent = '0%';
  progressInfo.textContent = `准备下载 ${pdfFiles.length} 个保单文件...`;
  
  try {
    const zip = new JSZip();
    let completed = 0;
    let failed = 0;
    
    const batchSize = 3;
    for (let i = 0; i < pdfFiles.length; i += batchSize) {
      const batch = pdfFiles.slice(i, i + batchSize);
      
      await Promise.all(batch.map(async (file) => {
        try {
          let response = await fetch(file.url);
          if (!response.ok) {
            const rawPath = file.url.replace('https://cdn.jsdelivr.net/gh/userwe123/policy-query@main/', '');
            const mirrorUrl = `https://ghfast.top/https://raw.githubusercontent.com/userwe123/policy-query/main/${rawPath}`;
            response = await fetch(mirrorUrl);
          }
          
          if (response.ok) {
            const blob = await response.blob();
            zip.folder(file.folder).file(file.filename, blob);
            completed++;
          } else {
            failed++;
          }
        } catch (e) {
          failed++;
        }
        
        const progress = Math.round(((completed + failed) / pdfFiles.length) * 100);
        progressFill.style.width = `${progress}%`;
        progressText.textContent = `${progress}%`;
        progressInfo.textContent = `已下载 ${completed} 个文件${failed > 0 ? `，失败 ${failed} 个` : ''} / 共 ${pdfFiles.length} 个`;
      }));
    }
    
    if (completed === 0) {
      alert('所有文件下载失败，请检查网络连接');
      progressContainer.style.display = 'none';
      return;
    }
    
    progressInfo.textContent = '正在打包ZIP文件...';
    const zipBlob = await zip.generateAsync({ type: 'blob' });
    
    const link = document.createElement('a');
    link.href = URL.createObjectURL(zipBlob);
    link.download = `${zipName}.zip`;
    link.click();
    
    setTimeout(() => {
      progressContainer.style.display = 'none';
    }, 2000);
    
    if (failed > 0) {
      alert(`导出完成！\n\n成功: ${completed} 个文件\n失败: ${failed} 个文件\n\nZIP文件已开始下载`);
    } else {
      alert(`导出成功！\n\n共 ${completed} 个保单文件\n\nZIP文件已开始下载`);
    }
    
  } catch (e) {
    console.error('导出失败:', e);
    alert('导出失败：' + e.message);
    progressContainer.style.display = 'none';
  }
}

function exportAllData() {
  if (!isAdmin) {
    alert('您没有权限执行此操作');
    return;
  }
  if (!confirm(`确定要导出系统中所有车辆保单数据吗？\n\n共 ${allVehicles.length} 辆车，${POLICY_DATA.length} 份保单`)) {
    return;
  }
  exportToCSV(allVehicles, `所有车辆保单数据_${new Date().toISOString().split('T')[0]}`);
}

function exportToCSV(vehicles, filename) {
  let csv = '车牌号,车架号,保单类型,保单号,起保日期,到期日期,保险公司,客服电话\n';
  
  vehicles.forEach(v => {
    v.policies.forEach(p => {
      const company = p.company || '合众财产保险股份有限公司广东分公司';
      const phone = '400-609-5555';
      csv += `"${v.plate}","${v.vin}","${p.type}","${p.policy_no}","${p.start}","${p.end}","${company}","${phone}"\n`;
    });
  });
  
  const bom = '\uFEFF';
  const blob = new Blob([bom + csv], { type: 'text/csv;charset=utf-8;' });
  const link = document.createElement('a');
  link.href = URL.createObjectURL(blob);
  link.download = `${filename}.csv`;
  link.click();
}
