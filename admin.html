<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>访问日志管理 - 保单查询系统</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { 
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif; 
  background: #f0f2f5; 
  color: #333; 
  min-height: 100vh; 
  padding: 20px;
}
.container {
  max-width: 1200px;
  margin: 0 auto;
}
.header {
  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  color: white;
  padding: 24px;
  border-radius: 12px;
  margin-bottom: 20px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.1);
}
.header h1 {
  font-size: 24px;
  margin-bottom: 8px;
}
.header p {
  font-size: 14px;
  opacity: 0.9;
}
.toolbar {
  background: white;
  padding: 16px;
  border-radius: 8px;
  margin-bottom: 20px;
  box-shadow: 0 1px 4px rgba(0,0,0,0.08);
  display: flex;
  gap: 12px;
  flex-wrap: wrap;
  align-items: center;
}
.btn {
  padding: 8px 16px;
  border: none;
  border-radius: 6px;
  font-size: 14px;
  cursor: pointer;
  transition: all 0.2s;
}
.btn-primary {
  background: #667eea;
  color: white;
}
.btn-primary:hover {
  background: #5568d3;
}
.btn-danger {
  background: #f5222d;
  color: white;
}
.btn-danger:hover {
  background: #d9363e;
}
.btn-secondary {
  background: #f0f0f0;
  color: #666;
}
.btn-secondary:hover {
  background: #e0e0e0;
}
.stats {
  display: flex;
  gap: 16px;
  margin-bottom: 20px;
  flex-wrap: wrap;
}
.stat-card {
  background: white;
  padding: 16px 24px;
  border-radius: 8px;
  box-shadow: 0 1px 4px rgba(0,0,0,0.08);
  flex: 1;
  min-width: 150px;
}
.stat-card .label {
  font-size: 13px;
  color: #888;
  margin-bottom: 4px;
}
.stat-card .value {
  font-size: 24px;
  font-weight: 600;
  color: #667eea;
}
.log-table {
  background: white;
  border-radius: 8px;
  box-shadow: 0 1px 4px rgba(0,0,0,0.08);
  overflow: hidden;
}
.log-table table {
  width: 100%;
  border-collapse: collapse;
}
.log-table th {
  background: #fafafa;
  padding: 12px 16px;
  text-align: left;
  font-weight: 600;
  font-size: 13px;
  color: #666;
  border-bottom: 1px solid #e8e8e8;
}
.log-table td {
  padding: 12px 16px;
  font-size: 13px;
  border-bottom: 1px solid #f0f0f0;
}
.log-table tr:hover {
  background: #fafbff;
}
.log-table .username {
  font-weight: 600;
  color: #667eea;
}
.log-table .ip {
  font-family: 'Courier New', monospace;
  color: #666;
}
.log-table .time {
  color: #888;
  font-size: 12px;
}
.log-table .ua {
  color: #999;
  font-size: 12px;
  max-width: 300px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.empty-state {
  text-align: center;
  padding: 60px 20px;
  color: #999;
}
.empty-state .icon {
  font-size: 48px;
  margin-bottom: 12px;
}
.loading {
  text-align: center;
  padding: 40px;
  color: #888;
}
@media (max-width: 768px) {
  .log-table {
    overflow-x: auto;
  }
  .log-table table {
    min-width: 800px;
  }
}
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>访问日志管理</h1>
    <p>追踪系统登录记录，及时发现异常访问</p>
  </div>
  
  <div class="toolbar">
    <button class="btn btn-primary" onclick="loadLogs()">刷新日志</button>
    <button class="btn btn-danger" onclick="clearLogs()">清除日志</button>
    <button class="btn btn-secondary" onclick="exportLogs()">导出日志</button>
    <button class="btn btn-secondary" onclick="toggleBlacklistPanel()">🚫 UA黑名单管理</button>
    <button class="btn btn-secondary" onclick="window.location.href='data-management.html'">📊 数据管理</button>
    <button class="btn btn-secondary" onclick="window.location.href='index.html'">返回查询</button>
  </div>
  
  <!-- UA 黑名单管理面板 -->
  <div id="blacklistPanel" style="display:none; background:white; padding:20px; border-radius:8px; margin-bottom:20px; box-shadow:0 1px 4px rgba(0,0,0,0.08);">
    <h3 style="margin-bottom:15px; color:#333;">🚫 User-Agent 黑名单管理</h3>
    <div style="margin-bottom:15px; display:flex; gap:10px; flex-wrap:wrap;">
      <input type="text" id="newBlacklistUA" placeholder="输入要禁止的 User-Agent" style="flex:1; min-width:300px; padding:8px 12px; border:1px solid #ddd; border-radius:6px;">
      <input type="text" id="newBlacklistReason" placeholder="原因（可选）" style="width:200px; padding:8px 12px; border:1px solid #ddd; border-radius:6px;">
      <button class="btn btn-primary" onclick="addToBlacklist()">添加到黑名单</button>
      <button class="btn btn-danger" onclick="autoDetectMalicious()">🔍 自动检测恶意UA</button>
    </div>
    <div id="blacklistContent">
      <div class="loading">加载中...</div>
    </div>
  </div>
  
  <div class="stats">
    <div class="stat-card">
      <div class="label">今日登录</div>
      <div class="value" id="todayCount">0</div>
    </div>
    <div class="stat-card">
      <div class="label">本周登录</div>
      <div class="value" id="weekCount">0</div>
    </div>
    <div class="stat-card">
      <div class="label">总登录次数</div>
      <div class="value" id="totalCount">0</div>
    </div>
  </div>
  
  <div class="log-table">
    <div id="logContent">
      <div class="loading">加载中...</div>
    </div>
  </div>
</div>

<script>
// 调试信息
console.log('检查登录状态...');
console.log('loggedIn:', sessionStorage.getItem('loggedIn'));
console.log('username:', sessionStorage.getItem('username'));

// 检查登录状态
if (!sessionStorage.getItem('loggedIn')) {
  alert('请先登录\n\n当前状态：未登录');
  window.location.href = 'login.html';
}

// 检查是否为管理员
const currentUser = sessionStorage.getItem('username');
console.log('当前用户:', currentUser);

if (currentUser !== 'zhangdp' && currentUser !== 'admin') {
  alert(`您没有权限访问此页面\n\n当前登录账号：${currentUser}\n管理员账号：zhangdp 或 admin\n\n请使用管理员账号重新登录`);
  sessionStorage.clear();
  window.location.href = 'login.html';
}

console.log('权限检查通过，允许访问');

// 日志记录 API
const LOG_API_URL = '/api';

// 加载日志
async function loadLogs() {
  try {
    const response = await fetch(LOG_API_URL + '/logs');
    const data = await response.json();
    
    if (data.error) {
      throw new Error(data.error);
    }
    
    const logs = data.logs || [];
    displayLogs(logs);
    updateStats(logs);
  } catch (e) {
    document.getElementById('logContent').innerHTML = `
      <div class="empty-state">
        <div class="icon">⚠️</div>
        <p>加载日志失败：${e.message}</p>
        <p style="margin-top:12px;font-size:13px;color:#aaa;">请检查 Worker 是否已部署</p>
      </div>
    `;
  }
}

// 显示日志
function displayLogs(logs) {
  if (logs.length === 0) {
    document.getElementById('logContent').innerHTML = `
      <div class="empty-state">
        <div class="icon">📭</div>
        <p>暂无登录记录</p>
      </div>
    `;
    return;
  }
  
  let html = `
    <table>
      <thead>
        <tr>
          <th>用户名</th>
          <th>IP 地址</th>
          <th>位置</th>
          <th>登录时间</th>
          <th>User-Agent</th>
          <th>操作</th>
        </tr>
      </thead>
      <tbody>
  `;
  
  logs.forEach(log => {
    const time = new Date(log.timestamp).toLocaleString('zh-CN');
    const ua = log.userAgent || 'unknown';
    const ipClass = 'ip-' + log.ip.replace(/\./g, '-').replace(/:/g, '-');
    
    html += `
      <tr>
        <td class="username">${log.username}</td>
        <td class="ip">${log.ip}</td>
        <td class="location ${ipClass}">查询中...</td>
        <td class="time">${time}</td>
        <td class="ua" title="${ua}">${ua}</td>
        <td style="white-space:nowrap;">
          <button class="btn btn-danger" style="padding:4px 8px; font-size:12px;" onclick="blockUA('${ua.replace(/'/g, "\\'")}')">🚫 禁止</button>
        </td>
      </tr>
    `;
  });
  
  html += '</tbody></table>';
  document.getElementById('logContent').innerHTML = html;
  
  // 查询所有 IP 的定位
  queryAllIPLocations(logs);
}

// 查询所有 IP 的定位信息
async function queryAllIPLocations(logs) {
  const uniqueIPs = [...new Set(logs.map(log => log.ip))];
  
  for (const ip of uniqueIPs) {
    try {
      const controller = new AbortController();
      const timeoutId = setTimeout(() => controller.abort(), 5000); // 5秒超时
      
      const response = await fetch(`/api/geoip?ip=${encodeURIComponent(ip)}`, {
        signal: controller.signal
      });
      clearTimeout(timeoutId);
      
      const data = await response.json();
      
      // 使用 class 选择器更新所有相同 IP 的单元格
      const ipClass = 'ip-' + ip.replace(/\./g, '-').replace(/:/g, '-');
      const locationCells = document.querySelectorAll(`.${ipClass}`);
      
      if (locationCells.length > 0) {
        if (data.country || data.region) {
          const location = `${data.country || ''} ${data.region || ''} ${data.city || ''}`.trim();
          const isp = data.isp || '';
          const latitude = data.latitude || '';
          const longitude = data.longitude || '';
          
          locationCells.forEach(cell => {
            cell.textContent = location;
            cell.title = `${location}\n运营商：${isp}\n坐标：${latitude}, ${longitude}`;
            cell.style.cursor = 'help';
          });
        } else {
          locationCells.forEach(cell => {
            cell.textContent = '未知位置';
            cell.style.color = '#999';
          });
        }
      }
      
      // 避免请求过快
      await new Promise(resolve => setTimeout(resolve, 500));
    } catch (e) {
      const ipClass = 'ip-' + ip.replace(/\./g, '-').replace(/:/g, '-');
      const locationCells = document.querySelectorAll(`.${ipClass}`);
      
      locationCells.forEach(cell => {
        if (e.name === 'AbortError') {
          cell.textContent = '查询超时';
        } else {
          cell.textContent = '查询失败';
        }
        cell.style.color = '#f5222d';
      });
    }
  }
}

// 更新统计
function updateStats(logs) {
  const now = new Date();
  const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const weekAgo = new Date(now.getTime() - 7 * 24 * 60 * 60 * 1000);
  
  let todayCount = 0;
  let weekCount = 0;
  
  logs.forEach(log => {
    const logTime = new Date(log.timestamp);
    if (logTime >= today) todayCount++;
    if (logTime >= weekAgo) weekCount++;
  });
  
  document.getElementById('todayCount').textContent = todayCount;
  document.getElementById('weekCount').textContent = weekCount;
  document.getElementById('totalCount').textContent = logs.length;
}

// 清除日志
async function clearLogs() {
  if (!confirm('确定要清除所有日志吗？此操作不可恢复！')) {
    return;
  }
  
  try {
    await fetch(LOG_API_URL + '/clear', { method: 'POST' });
    alert('日志已清除');
    loadLogs();
  } catch (e) {
    alert('清除失败：' + e.message);
  }
}

// 导出日志
function exportLogs() {
  // 从页面提取日志数据
  const rows = document.querySelectorAll('.log-table tbody tr');
  if (rows.length === 0) {
    alert('没有可导出的日志');
    return;
  }
  
  let csv = '用户名,IP地址,登录时间,User-Agent\n';
  rows.forEach(row => {
    const cells = row.querySelectorAll('td');
    const username = cells[0].textContent;
    const ip = cells[1].textContent;
    const time = cells[2].textContent;
    const ua = cells[3].getAttribute('title') || cells[3].textContent;
    
    csv += `"${username}","${ip}","${time}","${ua}"\n`;
  });
  
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  const link = document.createElement('a');
  link.href = URL.createObjectURL(blob);
  link.download = `login_logs_${new Date().toISOString().split('T')[0]}.csv`;
  link.click();
}

// 初始加载
loadLogs();

// 每 30 秒自动刷新
setInterval(loadLogs, 30000);

// ========== UA 黑名单管理功能 ==========

// 切换黑名单面板
function toggleBlacklistPanel() {
  const panel = document.getElementById('blacklistPanel');
  if (panel.style.display === 'none') {
    panel.style.display = 'block';
    loadBlacklist();
  } else {
    panel.style.display = 'none';
  }
}

// 加载黑名单
async function loadBlacklist() {
  try {
    const response = await fetch(LOG_API_URL + '/blacklist');
    const data = await response.json();
    
    if (!data.success) {
      throw new Error(data.error);
    }
    
    displayBlacklist(data.blacklist);
  } catch (e) {
    document.getElementById('blacklistContent').innerHTML = `
      <div class="empty-state">
        <div class="icon">⚠️</div>
        <p>加载黑名单失败：${e.message}</p>
      </div>
    `;
  }
}

// 显示黑名单
function displayBlacklist(blacklist) {
  if (blacklist.length === 0) {
    document.getElementById('blacklistContent').innerHTML = `
      <div class="empty-state">
        <div class="icon">✅</div>
        <p>黑名单为空</p>
      </div>
    `;
    return;
  }
  
  let html = `
    <table>
      <thead>
        <tr>
          <th>User-Agent</th>
          <th>原因</th>
          <th>添加时间</th>
          <th>拦截次数</th>
          <th>操作</th>
        </tr>
      </thead>
      <tbody>
  `;
  
  blacklist.forEach(item => {
    const time = new Date(item.addedAt).toLocaleString('zh-CN');
    const ua = item.userAgent;
    const shortUA = ua.length > 60 ? ua.substring(0, 60) + '...' : ua;
    
    html += `
      <tr>
        <td style="font-family:'Courier New',monospace; font-size:12px; max-width:400px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;" title="${ua}">${shortUA}</td>
        <td style="font-size:12px; color:#666;">${item.reason || '-'}</td>
        <td style="font-size:12px; color:#888;">${time}</td>
        <td style="font-size:12px; color:#667eea; font-weight:600;">${item.hitCount || 0}</td>
        <td style="white-space:nowrap;">
          <button class="btn btn-secondary" style="padding:4px 8px; font-size:12px;" onclick="removeFromBlacklist('${ua.replace(/'/g, "\\'")}')">解除禁止</button>
        </td>
      </tr>
    `;
  });
  
  html += '</tbody></table>';
  document.getElementById('blacklistContent').innerHTML = html;
}

// 添加到黑名单
async function addToBlacklist() {
  const uaInput = document.getElementById('newBlacklistUA');
  const reasonInput = document.getElementById('newBlacklistReason');
  
  const userAgent = uaInput.value.trim();
  const reason = reasonInput.value.trim();
  
  if (!userAgent) {
    alert('请输入 User-Agent');
    return;
  }
  
  try {
    const response = await fetch(LOG_API_URL + '/blacklist', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ userAgent, reason: reason || '手动添加' })
    });
    
    const data = await response.json();
    
    if (data.success) {
      alert('已添加到黑名单');
      uaInput.value = '';
      reasonInput.value = '';
      loadBlacklist();
    } else {
      alert('添加失败：' + data.error);
    }
  } catch (e) {
    alert('添加失败：' + e.message);
  }
}

// 从黑名单移除
async function removeFromBlacklist(userAgent) {
  if (!confirm(`确定要解除禁止以下 User-Agent 吗？\n\n${userAgent}`)) {
    return;
  }
  
  try {
    const response = await fetch(LOG_API_URL + '/blacklist', {
      method: 'DELETE',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ userAgent })
    });
    
    const data = await response.json();
    
    if (data.success) {
      alert('已从黑名单移除');
      loadBlacklist();
    } else {
      alert('移除失败：' + data.error);
    }
  } catch (e) {
    alert('移除失败：' + e.message);
  }
}

// 从日志中禁止 UA
function blockUA(userAgent) {
  if (!userAgent || userAgent === 'unknown') {
    alert('无法禁止空的 User-Agent');
    return;
  }
  
  if (confirm(`确定要禁止以下 User-Agent 吗？\n\n${userAgent}\n\n该 UA 的所有后续访问将被拦截。`)) {
    document.getElementById('newBlacklistUA').value = userAgent;
    toggleBlacklistPanel();
  }
}

// 自动检测恶意 UA
async function autoDetectMalicious() {
  if (!confirm('将自动分析 Bot 日志，检测并添加恶意 User-Agent 到黑名单。\n\n检测规则：\n1. 匹配已知攻击工具特征\n2. 高频访问（>50次）\n3. 扫描多个敏感路径\n\n确定要继续吗？')) {
    return;
  }
  
  try {
    const response = await fetch(LOG_API_URL + '/blacklist/auto', {
      method: 'PUT'
    });
    
    const data = await response.json();
    
    if (data.success) {
      let message = `自动检测完成\n\n新增 ${data.added.length} 个恶意 User-Agent`;
      
      if (data.added.length > 0) {
        message += '\n\n新增的 UA：\n';
        data.added.forEach(item => {
          const shortUA = item.ua.length > 50 ? item.ua.substring(0, 50) + '...' : item.ua;
          message += `\n• ${shortUA}\n  原因：${item.reason}`;
        });
      }
      
      alert(message);
      loadBlacklist();
    } else {
      alert('检测失败：' + data.error);
    }
  } catch (e) {
    alert('检测失败：' + e.message);
  }
}
</script>
</body>
</html>
