<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>数据看板 - 保单查询系统</title>
<link rel="stylesheet" href="styles.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script>
// 登录检查
if (!sessionStorage.getItem('loggedIn')) {
  window.location.href = 'login.html';
}
</script>
<style>
/* 页面特定样式 */
.header-back-btn {
  position: absolute !important;
  top: 24px !important;
  right: 24px !important;
  z-index: 10 !important;
}

/* 页面特定样式 */
.charts-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
  gap: var(--spacing-lg);
  margin-bottom: var(--spacing-lg);
}

.chart-card {
  background: var(--bg-secondary);
  padding: var(--spacing-lg);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-md);
}

.chart-card h3 {
  font-size: var(--font-size-lg);
  margin-bottom: var(--spacing-md);
  color: var(--text-primary);
  display: flex;
  align-items: center;
  gap: var(--spacing-sm);
}

.chart-container {
  position: relative;
  height: 300px;
}

.alert-section {
  background: var(--bg-secondary);
  padding: var(--spacing-lg);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-md);
  margin-bottom: var(--spacing-lg);
}

.alert-section h3 {
  font-size: var(--font-size-lg);
  margin-bottom: var(--spacing-md);
  color: var(--text-primary);
  display: flex;
  align-items: center;
  gap: var(--spacing-sm);
}

.alert-list {
  max-height: 400px;
  overflow-y: auto;
}

.alert-item {
  padding: var(--spacing-md);
  border-left: 4px solid var(--warning-color);
  background: rgba(250, 173, 20, 0.05);
  margin-bottom: var(--spacing-sm);
  border-radius: var(--radius-md);
  display: flex;
  justify-content: space-between;
  align-items: center;
  transition: all var(--transition-fast);
}

.alert-item:hover {
  transform: translateX(4px);
  box-shadow: var(--shadow-sm);
}

.alert-item.expired {
  border-left-color: var(--danger-color);
  background: rgba(245, 34, 45, 0.05);
}

.alert-item .info {
  flex: 1;
}

.alert-item .plate {
  font-weight: 600;
  font-size: var(--font-size-base);
  margin-bottom: 4px;
  color: var(--text-primary);
}

.alert-item .vin {
  font-size: var(--font-size-xs);
  color: var(--text-muted);
  font-family: 'Courier New', monospace;
}

.alert-item .days {
  padding: 6px 16px;
  border-radius: 20px;
  font-size: var(--font-size-sm);
  font-weight: 600;
}

.alert-item .days.warning {
  background: var(--warning-color);
  color: white;
}

.alert-item .days.danger {
  background: var(--danger-color);
  color: white;
}

.loading-overlay {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background: rgba(0,0,0,0.5);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 9999;
}

.loading-spinner {
  background: var(--bg-secondary);
  padding: var(--spacing-xl);
  border-radius: var(--radius-lg);
  text-align: center;
}

.spinner {
  width: 48px;
  height: 48px;
  border: 4px solid var(--border-color);
  border-top-color: var(--primary-color);
  border-radius: 50%;
  animation: spin 1s linear infinite;
  margin: 0 auto var(--spacing-md);
}

@keyframes spin {
  to { transform: rotate(360deg); }
}

@media (max-width: 768px) {
  .charts-grid {
    grid-template-columns: 1fr;
  }
  
  .chart-container {
    height: 250px;
  }
}
</style>
</head>
<body>

<div id="loadingOverlay" class="loading-overlay">
  <div class="loading-spinner">
    <div class="spinner"></div>
    <div>加载数据中...</div>
  </div>
</div>

<div class="container">
  <div class="header">
    <h1>📊 数据看板</h1>
    <p>保单数据统计与分析</p>
    <a href="index.html" class="btn btn-ghost header-back-btn">← 返回查询</a>
  </div>
  
  <div class="stats-grid" id="statsGrid">
    <div class="stat-card">
      <div class="icon">🚗</div>
      <div class="label">车辆总数</div>
      <div class="value" id="totalVehicles">0</div>
      <div class="sub">已投保车辆</div>
    </div>
    <div class="stat-card">
      <div class="icon">📄</div>
      <div class="label">保单总数</div>
      <div class="value" id="totalPolicies">0</div>
      <div class="sub">交强险 + 商业险</div>
    </div>
    <div class="stat-card success">
      <div class="icon">✅</div>
      <div class="label">有效保单</div>
      <div class="value" id="validPolicies">0</div>
      <div class="sub">未到期保单</div>
    </div>
    <div class="stat-card warning">
      <div class="icon">⚠️</div>
      <div class="label">即将到期</div>
      <div class="value" id="expiringPolicies">0</div>
      <div class="sub">30天内到期</div>
    </div>
    <div class="stat-card danger">
      <div class="icon">❌</div>
      <div class="label">已到期</div>
      <div class="value" id="expiredPolicies">0</div>
      <div class="sub">需要续保</div>
    </div>
  </div>
  
  <div class="charts-grid">
    <div class="chart-card">
      <h3>📈 保单类型分布</h3>
      <div class="chart-container">
        <canvas id="policyTypeChart"></canvas>
      </div>
    </div>
    <div class="chart-card">
      <h3>📅 保单状态分布</h3>
      <div class="chart-container">
        <canvas id="policyStatusChart"></canvas>
      </div>
    </div>
    <div class="chart-card">
      <h3>📊 月度到期趋势</h3>
      <div class="chart-container">
        <canvas id="monthlyTrendChart"></canvas>
      </div>
    </div>
    <div class="chart-card">
      <h3>🏢 保险公司分布</h3>
      <div class="chart-container">
        <canvas id="companyChart"></canvas>
      </div>
    </div>
  </div>
  
  <div class="alert-section">
    <h3>⚠️ 即将到期提醒（30天内）</h3>
    <div class="alert-list" id="expiringList"></div>
  </div>
  
  <div class="alert-section">
    <h3>❌ 已到期未续保</h3>
    <div class="alert-list" id="expiredList"></div>
  </div>
</div>

<script src="theme.js"></script>
<script>
let POLICY_DATA = [];
let chartInstances = {};

// 加载数据（优先使用预加载的数据）
async function loadData() {
  try {
    // 检查是否有预加载的数据
    const preloadedData = sessionStorage.getItem('preloadedData');
    const preloadedTime = sessionStorage.getItem('preloadedTime');
    
    if (preloadedData && preloadedTime) {
      const age = Date.now() - parseInt(preloadedTime);
      // 如果预加载数据在5分钟内，直接使用
      if (age < 5 * 60 * 1000) {
        POLICY_DATA = JSON.parse(preloadedData);
        console.log('✓ 使用预加载数据');
      } else {
        // 否则重新加载
        const resp = await fetch('data.json?t=' + Date.now());
        if (!resp.ok) throw new Error('HTTP ' + resp.status);
        POLICY_DATA = await resp.json();
        console.log('✓ 重新加载数据');
      }
    } else {
      // 没有预加载数据，正常加载
      const resp = await fetch('data.json?t=' + Date.now());
      if (!resp.ok) throw new Error('HTTP ' + resp.status);
      POLICY_DATA = await resp.json();
      console.log('✓ 首次加载数据');
    }
    
    updateStats();
    renderCharts();
    renderAlerts();
    
    // 隐藏加载动画
    document.getElementById('loadingOverlay').style.display = 'none';
  } catch (e) {
    console.error('加载数据失败:', e);
    alert('数据加载失败，请刷新页面重试');
    document.getElementById('loadingOverlay').style.display = 'none';
  }
}

// 更新统计数据
function updateStats() {
  const today = new Date();
  const thirtyDaysLater = new Date(today.getTime() + 30 * 24 * 60 * 60 * 1000);
  
  const vehicles = new Set(POLICY_DATA.map(p => p.vin));
  const validPolicies = POLICY_DATA.filter(p => {
    if (!p.end) return false;
    const endDate = new Date(p.end);
    return endDate >= today;
  });
  const expiringPolicies = POLICY_DATA.filter(p => {
    if (!p.end) return false;
    const endDate = new Date(p.end);
    return endDate >= today && endDate <= thirtyDaysLater;
  });
  const expiredPolicies = POLICY_DATA.filter(p => {
    if (!p.end) return false;
    const endDate = new Date(p.end);
    return endDate < today;
  });
  
  document.getElementById('totalVehicles').textContent = vehicles.size;
  document.getElementById('totalPolicies').textContent = POLICY_DATA.length;
  document.getElementById('validPolicies').textContent = validPolicies.length;
  document.getElementById('expiringPolicies').textContent = expiringPolicies.length;
  document.getElementById('expiredPolicies').textContent = expiredPolicies.length;
}

// 渲染图表
function renderCharts() {
  // 销毁旧图表
  Object.values(chartInstances).forEach(chart => chart.destroy());
  chartInstances = {};
  
  // 获取主题色
  const primaryColor = getComputedStyle(document.documentElement).getPropertyValue('--primary-color').trim() || '#667eea';
  const secondaryColor = getComputedStyle(document.documentElement).getPropertyValue('--secondary-color').trim() || '#764ba2';
  
  // 保单类型分布
  const jqxCount = POLICY_DATA.filter(p => p.type === '交强险').length;
  const syxCount = POLICY_DATA.filter(p => p.type === '商业险').length;
  
  chartInstances.policyType = new Chart(document.getElementById('policyTypeChart'), {
    type: 'doughnut',
    data: {
      labels: ['交强险', '商业险'],
      datasets: [{
        data: [jqxCount, syxCount],
        backgroundColor: ['#52c41a', '#1890ff'],
        borderWidth: 0
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: {
        legend: {
          position: 'bottom',
          labels: {
            padding: 20,
            font: {
              size: 14
            }
          }
        }
      }
    }
  });
  
  // 保单状态分布
  const today = new Date();
  const thirtyDaysLater = new Date(today.getTime() + 30 * 24 * 60 * 60 * 1000);
  
  const validCount = POLICY_DATA.filter(p => {
    if (!p.end) return false;
    const endDate = new Date(p.end);
    return endDate > thirtyDaysLater;
  }).length;
  
  const expiringCount = POLICY_DATA.filter(p => {
    if (!p.end) return false;
    const endDate = new Date(p.end);
    return endDate >= today && endDate <= thirtyDaysLater;
  }).length;
  
  const expiredCount = POLICY_DATA.filter(p => {
    if (!p.end) return false;
    const endDate = new Date(p.end);
    return endDate < today;
  }).length;
  
  chartInstances.policyStatus = new Chart(document.getElementById('policyStatusChart'), {
    type: 'doughnut',
    data: {
      labels: ['有效', '即将到期', '已到期'],
      datasets: [{
        data: [validCount, expiringCount, expiredCount],
        backgroundColor: ['#52c41a', '#faad14', '#f5222d'],
        borderWidth: 0
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: {
        legend: {
          position: 'bottom',
          labels: {
            padding: 20,
            font: {
              size: 14
            }
          }
        }
      }
    }
  });
  
  // 月度到期趋势
  const monthlyData = {};
  POLICY_DATA.forEach(p => {
    if (!p.end) return;
    const endDate = new Date(p.end);
    const monthKey = `${endDate.getFullYear()}-${String(endDate.getMonth() + 1).padStart(2, '0')}`;
    monthlyData[monthKey] = (monthlyData[monthKey] || 0) + 1;
  });
  
  const sortedMonths = Object.keys(monthlyData).sort();
  const recentMonths = sortedMonths.slice(-12);
  
  chartInstances.monthlyTrend = new Chart(document.getElementById('monthlyTrendChart'), {
    type: 'line',
    data: {
      labels: recentMonths.map(m => m.substring(5) + '月'),
      datasets: [{
        label: '到期保单数',
        data: recentMonths.map(m => monthlyData[m]),
        borderColor: primaryColor,
        backgroundColor: primaryColor + '20',
        tension: 0.4,
        fill: true,
        borderWidth: 3,
        pointRadius: 4,
        pointHoverRadius: 6
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: {
        legend: {
          display: false
        }
      },
      scales: {
        y: {
          beginAtZero: true,
          grid: {
            color: 'rgba(0,0,0,0.05)'
          }
        },
        x: {
          grid: {
            display: false
          }
        }
      }
    }
  });
  
  // 保险公司分布
  const companyData = {};
  POLICY_DATA.forEach(p => {
    const company = p.company || '未知';
    companyData[company] = (companyData[company] || 0) + 1;
  });
  
  const sortedCompanies = Object.entries(companyData)
    .sort((a, b) => b[1] - a[1])
    .slice(0, 5);
  
  chartInstances.company = new Chart(document.getElementById('companyChart'), {
    type: 'bar',
    data: {
      labels: sortedCompanies.map(([name]) => name.length > 15 ? name.substring(0, 15) + '...' : name),
      datasets: [{
        label: '保单数',
        data: sortedCompanies.map(([, count]) => count),
        backgroundColor: primaryColor,
        borderRadius: 8,
        barThickness: 40
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: {
        legend: {
          display: false
        }
      },
      scales: {
        y: {
          beginAtZero: true,
          grid: {
            color: 'rgba(0,0,0,0.05)'
          }
        },
        x: {
          grid: {
            display: false
          }
        }
      }
    }
  });
}

// 渲染提醒列表
function renderAlerts() {
  const today = new Date();
  const thirtyDaysLater = new Date(today.getTime() + 30 * 24 * 60 * 60 * 1000);
  
  // 即将到期
  const expiringPolicies = POLICY_DATA.filter(p => {
    if (!p.end) return false;
    const endDate = new Date(p.end);
    return endDate >= today && endDate <= thirtyDaysLater;
  }).sort((a, b) => new Date(a.end) - new Date(b.end));
  
  const expiringList = document.getElementById('expiringList');
  if (expiringPolicies.length === 0) {
    expiringList.innerHTML = '<div class="empty-state"><div class="icon">✅</div><div class="title">暂无即将到期的保单</div></div>';
  } else {
    expiringList.innerHTML = expiringPolicies.slice(0, 20).map(p => {
      const endDate = new Date(p.end);
      const days = Math.ceil((endDate - today) / (1000 * 60 * 60 * 24));
      return `
        <div class="alert-item">
          <div class="info">
            <div class="plate">${p.plate} · ${p.type}</div>
            <div class="vin">${p.vin}</div>
          </div>
          <div class="days warning">${days}天后到期</div>
        </div>
      `;
    }).join('');
    
    if (expiringPolicies.length > 20) {
      expiringList.innerHTML += `<div style="text-align:center;padding:var(--spacing-md);color:var(--text-muted);">还有 ${expiringPolicies.length - 20} 条记录...</div>`;
    }
  }
  
  // 已到期
  const expiredPolicies = POLICY_DATA.filter(p => {
    if (!p.end) return false;
    const endDate = new Date(p.end);
    return endDate < today;
  }).sort((a, b) => new Date(b.end) - new Date(a.end));
  
  const expiredList = document.getElementById('expiredList');
  if (expiredPolicies.length === 0) {
    expiredList.innerHTML = '<div class="empty-state"><div class="icon">✅</div><div class="title">暂无已到期的保单</div></div>';
  } else {
    expiredList.innerHTML = expiredPolicies.slice(0, 20).map(p => {
      const endDate = new Date(p.end);
      const days = Math.ceil((today - endDate) / (1000 * 60 * 60 * 24));
      return `
        <div class="alert-item expired">
          <div class="info">
            <div class="plate">${p.plate} · ${p.type}</div>
            <div class="vin">${p.vin}</div>
          </div>
          <div class="days danger">已到期${days}天</div>
        </div>
      `;
    }).join('');
    
    if (expiredPolicies.length > 20) {
      expiredList.innerHTML += `<div style="text-align:center;padding:var(--spacing-md);color:var(--text-muted);">还有 ${expiredPolicies.length - 20} 条记录...</div>`;
    }
  }
}

// 页面加载时获取数据
loadData();
</script>
</body>
</html>
