<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>登录 - 保单查询系统</title>
<link rel="stylesheet" href="styles.css">
<style>
body {
  background: linear-gradient(135deg, var(--primary-color) 0%, var(--secondary-color) 100%);
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
  position: relative;
  overflow: hidden;
}

/* 背景动画 */
body::before {
  content: '';
  position: absolute;
  top: -50%;
  left: -50%;
  width: 200%;
  height: 200%;
  background: radial-gradient(circle, rgba(255,255,255,0.1) 1px, transparent 1px);
  background-size: 50px 50px;
  animation: backgroundMove 20s linear infinite;
  opacity: 0.3;
}

@keyframes backgroundMove {
  0% { transform: translate(0, 0); }
  100% { transform: translate(50px, 50px); }
}

.login-container {
  position: relative;
  z-index: 1;
  width: 100%;
  max-width: 440px;
}

.login-card {
  background: var(--bg-secondary);
  border-radius: var(--radius-xl);
  padding: 48px 40px;
  box-shadow: var(--shadow-xl);
  backdrop-filter: blur(10px);
  animation: slideUp 0.6s ease;
}

@keyframes slideUp {
  from {
    opacity: 0;
    transform: translateY(30px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

.logo {
  text-align: center;
  margin-bottom: 40px;
}

.logo-icon {
  width: 80px;
  height: 80px;
  background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
  border-radius: 20px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-size: 40px;
  margin-bottom: 20px;
  box-shadow: var(--shadow-lg);
  animation: pulse 2s ease-in-out infinite;
}

@keyframes pulse {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.05); }
}

.logo h1 {
  font-size: var(--font-size-2xl);
  color: var(--text-primary);
  margin-bottom: 8px;
  font-weight: 700;
}

.logo p {
  font-size: var(--font-size-base);
  color: var(--text-secondary);
}

.form-group {
  margin-bottom: 24px;
}

.form-group label {
  display: block;
  font-size: var(--font-size-sm);
  color: var(--text-secondary);
  margin-bottom: 8px;
  font-weight: 600;
}

.input-wrapper {
  position: relative;
}

.input-icon {
  position: absolute;
  left: 16px;
  top: 50%;
  transform: translateY(-50%);
  font-size: 20px;
  opacity: 0.5;
}

.form-group input {
  width: 100%;
  padding: 14px 16px 14px 48px;
  border: 2px solid var(--border-color);
  border-radius: var(--radius-md);
  font-size: var(--font-size-base);
  color: var(--text-primary);
  background: var(--bg-secondary);
  transition: all var(--transition-fast);
  outline: none;
}

.form-group input:focus {
  border-color: var(--primary-color);
  box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.1);
}

.form-group input::placeholder {
  color: var(--text-muted);
}

.honey-pot {
  position: absolute;
  left: -9999px;
  opacity: 0;
  height: 0;
  width: 0;
  overflow: hidden;
}

.captcha-group {
  display: none;
  background: var(--bg-tertiary);
  border: 2px solid var(--border-color);
  border-radius: var(--radius-md);
  padding: 20px;
  margin-bottom: 24px;
  animation: slideDown 0.3s ease;
}

@keyframes slideDown {
  from {
    opacity: 0;
    transform: translateY(-10px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

.captcha-group.show {
  display: block;
}

.captcha-question {
  font-size: var(--font-size-xl);
  font-weight: 700;
  color: var(--text-primary);
  text-align: center;
  margin-bottom: 16px;
  padding: 12px;
  background: var(--bg-secondary);
  border-radius: var(--radius-md);
  border: 2px dashed var(--border-color);
  letter-spacing: 2px;
}

.captcha-row {
  display: flex;
  gap: 12px;
  align-items: center;
}

.captcha-row input {
  flex: 1;
  padding: 12px 16px;
  border: 2px solid var(--border-color);
  border-radius: var(--radius-md);
  font-size: var(--font-size-base);
  outline: none;
  transition: all var(--transition-fast);
}

.captcha-row input:focus {
  border-color: var(--primary-color);
}

.captcha-refresh {
  padding: 12px 16px;
  background: var(--primary-color);
  color: white;
  border: none;
  border-radius: var(--radius-md);
  cursor: pointer;
  font-size: 18px;
  transition: all var(--transition-fast);
}

.captcha-refresh:hover {
  background: var(--primary-dark);
  transform: rotate(180deg);
}

.login-btn {
  width: 100%;
  padding: 16px;
  background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
  color: white;
  border: none;
  border-radius: var(--radius-md);
  font-size: var(--font-size-lg);
  font-weight: 600;
  cursor: pointer;
  transition: all var(--transition-normal);
  box-shadow: var(--shadow-md);
  position: relative;
  overflow: hidden;
}

.login-btn::before {
  content: '';
  position: absolute;
  top: 50%;
  left: 50%;
  width: 0;
  height: 0;
  border-radius: 50%;
  background: rgba(255,255,255,0.3);
  transform: translate(-50%, -50%);
  transition: width 0.6s, height 0.6s;
}

.login-btn:hover::before {
  width: 300px;
  height: 300px;
}

.login-btn:hover {
  transform: translateY(-2px);
  box-shadow: var(--shadow-lg);
}

.login-btn:active {
  transform: translateY(0);
}

.login-btn:disabled {
  opacity: 0.6;
  cursor: not-allowed;
}

.error-msg {
  display: none;
  background: rgba(245, 34, 45, 0.1);
  color: var(--danger-color);
  padding: 12px 16px;
  border-radius: var(--radius-md);
  margin-bottom: 20px;
  font-size: var(--font-size-sm);
  border-left: 4px solid var(--danger-color);
  animation: shake 0.5s ease;
}

@keyframes shake {
  0%, 100% { transform: translateX(0); }
  25% { transform: translateX(-10px); }
  75% { transform: translateX(10px); }
}

.error-msg.show {
  display: block;
}

.info-box {
  margin-top: 32px;
  padding: 16px;
  background: var(--bg-tertiary);
  border-radius: var(--radius-md);
  border-left: 4px solid var(--info-color);
}

.info-box h4 {
  font-size: var(--font-size-sm);
  color: var(--text-secondary);
  margin-bottom: 8px;
  font-weight: 600;
}

.info-box ul {
  list-style: none;
  font-size: var(--font-size-xs);
  color: var(--text-muted);
}

.info-box li {
  padding: 4px 0;
}

.info-box code {
  background: var(--bg-secondary);
  padding: 2px 6px;
  border-radius: 4px;
  font-family: 'Courier New', monospace;
  color: var(--primary-color);
}

@media (max-width: 480px) {
  .login-card {
    padding: 32px 24px;
  }
  
  .logo-icon {
    width: 64px;
    height: 64px;
    font-size: 32px;
  }
  
  .logo h1 {
    font-size: var(--font-size-xl);
  }
}
</style>
</head>
<body>

<div class="login-container">
  <div class="login-card">
    <div class="logo">
      <div class="logo-icon">🛡️</div>
      <h1>保单查询系统</h1>
      <p>请输入您的账号信息登录</p>
    </div>
    
    <div class="error-msg" id="errorMsg"></div>
    
    <form id="loginForm" onsubmit="return doLogin(event)">
      <div class="form-group">
        <label>用户名</label>
        <div class="input-wrapper">
          <span class="input-icon">👤</span>
          <input type="text" id="username" placeholder="请输入用户名" required autocomplete="username">
        </div>
      </div>
      
      <div class="form-group">
        <label>密码</label>
        <div class="input-wrapper">
          <span class="input-icon">🔒</span>
          <input type="password" id="password" placeholder="请输入密码" required autocomplete="current-password">
        </div>
      </div>
      
      <!-- 蜜罐字段 -->
      <div class="honey-pot" aria-hidden="true">
        <label>不要填写此字段</label>
        <input type="text" name="honeypot" id="honeypot" tabindex="-1" autocomplete="off">
      </div>
      
      <!-- 验证码 -->
      <div class="captcha-group" id="captchaGroup">
        <div class="captcha-question" id="captchaQuestion"></div>
        <div class="captcha-row">
          <input type="text" id="captchaAnswer" placeholder="请输入答案">
          <button type="button" class="captcha-refresh" onclick="refreshCaptcha()">🔄</button>
        </div>
      </div>
      
      <button type="submit" class="login-btn" id="loginBtn">
        <span id="loginBtnText">登 录</span>
      </button>
    </form>
    
    <div class="info-box">
      <h4>💡 测试账号</h4>
      <ul>
        <li>管理员：<code>zhangdp</code> / <code>Aa123456</code></li>
        <li>测试员：<code>test</code> / <code>test123</code></li>
      </ul>
    </div>
  </div>
</div>

<script src="theme.js"></script>
<script>
let captchaData = null;

// 生成验证码
async function generateCaptcha() {
  try {
    const resp = await fetch('/api/captcha?action=generate');
    const data = await resp.json();
    if (data.success) {
      captchaData = data;
      document.getElementById('captchaQuestion').textContent = data.question;
      document.getElementById('captchaGroup').classList.add('show');
    }
  } catch (e) {
    console.error('生成验证码失败:', e);
  }
}

// 刷新验证码
async function refreshCaptcha() {
  await generateCaptcha();
}

// 登录
async function doLogin(event) {
  event.preventDefault();
  
  const username = document.getElementById('username').value.trim();
  const password = document.getElementById('password').value;
  const honeypot = document.getElementById('honeypot').value;
  const captchaAnswer = document.getElementById('captchaAnswer').value.trim();
  
  // 检查蜜罐
  if (honeypot) {
    showError('检测到异常行为');
    return false;
  }
  
  // 检查验证码
  if (document.getElementById('captchaGroup').classList.contains('show')) {
    if (!captchaAnswer) {
      showError('请输入验证码');
      return false;
    }
    
    try {
      const verifyResp = await fetch('/api/captcha?action=verify', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          token: captchaData.token,
          answer: captchaAnswer
        })
      });
      
      const verifyData = await verifyResp.json();
      if (!verifyData.success) {
        showError('验证码错误');
        await refreshCaptcha();
        return false;
      }
    } catch (e) {
      console.error('验证码验证失败:', e);
    }
  }
  
  // 登录验证
  const loginBtn = document.getElementById('loginBtn');
  const loginBtnText = document.getElementById('loginBtnText');
  loginBtn.disabled = true;
  loginBtnText.textContent = '登录中...';
  
  try {
    const resp = await fetch('/api/log', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        username: username,
        password: password,
        action: 'login'
      })
    });
    
    const data = await resp.json();
    
    if (data.success) {
      // 登录成功
      sessionStorage.setItem('loggedIn', 'true');
      sessionStorage.setItem('username', username);
      
      loginBtnText.textContent = '✓ 登录成功';
      loginBtn.style.background = 'var(--success-color)';
      
      setTimeout(() => {
        window.location.href = 'index.html';
      }, 500);
    } else {
      // 登录失败
      showError(data.error || '用户名或密码错误');
      loginBtn.disabled = false;
      loginBtnText.textContent = '登 录';
      
      // 如果失败次数过多，显示验证码
      if (data.requireCaptcha) {
        await generateCaptcha();
      }
    }
  } catch (e) {
    showError('网络错误，请重试');
    loginBtn.disabled = false;
    loginBtnText.textContent = '登 录';
  }
  
  return false;
}

function showError(msg) {
  const errorBox = document.getElementById('errorMsg');
  errorBox.textContent = '❌ ' + msg;
  errorBox.classList.add('show');
  
  setTimeout(() => {
    errorBox.classList.remove('show');
  }, 5000);
}

// 页面加载时检查是否需要验证码
(async function() {
  try {
    const resp = await fetch('/api/captcha?action=check');
    const data = await resp.json();
    if (data.requireCaptcha) {
      await generateCaptcha();
    }
  } catch (e) {
    console.error('检查验证码状态失败:', e);
  }
})();
</script>
</body>
</html>
